version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: polymee_web
    ports:
      - "8000:80"
    environment:
      - DB_CONNECTION=sqlsrv
      - DB_SQLSRV_HOST=db
      - DB_SQLSRV_PORT=1433
      - DB_SQLSRV_DB=Polymeet
      - DB_SQLSRV_USER=sa
      - DB_SQLSRV_PASS=ThayBangMatKhauManh123!
      - GEMINI_API_KEY=${GEMINI_API_KEY:-DEMO_KEY_FALLBACK}
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    networks:
      - polymee_network

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: polymee_sqlserver
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "ThayBangMatKhauManh123!"
    ports:
      - "14331:1433"
    volumes:
      - polymee_sqlsrv_data:/var/opt/mssql
    networks:
      - polymee_network

volumes:
  polymee_sqlsrv_data:

networks:
  polymee_network:
    driver: bridge